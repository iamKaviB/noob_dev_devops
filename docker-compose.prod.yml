# =============================================================================
# docker-compose.prod.yml — used on the SERVER by the CI/CD deploy job.
#
# Compose merges this file on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Difference from local: instead of BUILDING images from source, EC2
# PULLS the images that GitHub Actions already built and pushed to AWS ECR.
# IMAGE_PREFIX is set by the deploy job
# (e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com/noob-dev).
# =============================================================================

services:
  backend:
    image: ${IMAGE_PREFIX}/backend:latest
    pull_policy: always

  frontend:
    image: ${IMAGE_PREFIX}/frontend:latest
    pull_policy: always
