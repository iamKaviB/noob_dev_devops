# =============================================================================
# .github/workflows/ci-cd.yml — Docker → GitHub Actions → AWS ECR → AWS EC2
#
# Every push to main (or "Run workflow"):
#   build   → build backend + frontend images, push both to ECR
#   deploy  → SSH into EC2, pull the new images, restart everything
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   EC2_HOST, EC2_USER, EC2_SSH_KEY
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  # Folder on the EC2 server where the app is deployed (e.g. /home/ubuntu/app).
  EC2_PATH: /home/${{ secrets.EC2_USER }}/app
  # ECR repositories are noob-dev/backend and noob-dev/frontend
  REPO_PREFIX: noob-dev

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
        include:
          - service: backend
            context: ./DockerBackend
          - service: frontend
            context: ./DockerFe
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Creates the repository on the first run; does nothing if it already exists.
      - name: Create ECR repository
        run: aws ecr create-repository --repository-name "$REPO_PREFIX/${{ matrix.service }}" || true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: |
            BACKEND_URL=http://backend:8080
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPO_PREFIX }}/${{ matrix.service }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Get ECR registry address
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,docker-compose.prod.yml,.env.example
          target: ${{ env.EC2_PATH }}

      # Get the ECR login here (the runner has AWS credentials) and pass it to EC2,
      # so the server needs neither the AWS CLI nor an IAM role.
      - name: Get ECR password
        run: |
          PW=$(aws ecr get-login-password)
          echo "::add-mask::$PW"
          echo "ECR_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Pull from ECR and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_PASSWORD
          script: |
            set -e
            # First deploy: install Docker + Compose if the server doesn't have them.
            if ! command -v docker >/dev/null || ! sudo docker compose version >/dev/null 2>&1; then
              if command -v apt-get >/dev/null; then
                curl -fsSL https://get.docker.com | sudo sh
              else
                sudo dnf install -y docker || sudo yum install -y docker
                sudo mkdir -p /usr/local/lib/docker/cli-plugins
                sudo curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
                  -o /usr/local/lib/docker/cli-plugins/docker-compose
                sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              fi
              sudo systemctl enable --now docker
            fi
            cd "${{ env.EC2_PATH }}"
            [ -f .env ] || cp .env.example .env
            REGISTRY="${{ steps.ecr.outputs.registry }}"
            export IMAGE_PREFIX="$REGISTRY/${{ env.REPO_PREFIX }}"
            echo "$ECR_PASSWORD" | sudo docker login --username AWS --password-stdin "$REGISTRY"
            COMPOSE="sudo -E docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $COMPOSE pull
            $COMPOSE up -d
            sudo docker image prune -f
