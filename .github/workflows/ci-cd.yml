# =============================================================================
# .github/workflows/ci-cd.yml — GitHub Actions pipeline
#
# Same idea as ./deploy.sh, but on GitHub's servers on every push:
#   changes   → which folder changed? DockerBackend/, DockerFe/, or both
#   backend   → build the backend image   (only if DockerBackend/ changed)
#   frontend  → build the frontend image  (only if DockerFe/ changed)
#   deploy    → on the server, pull + restart ONLY the services that were rebuilt
#
# Pull requests:   build only (CI)  — proves the Dockerfiles still work.
# Push to main:    build + push images to GitHub Container Registry (ghcr.io)
#                  + deploy (only once the DEPLOY_HOST variable is set, see README).
# =============================================================================

name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  # Adds a "Run workflow" button in the Actions tab → rebuilds + deploys everything.
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Image names must be lowercase: ghcr.io/<owner>/<repo>/backend
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # changes: decide what needs building (like the fingerprint check in deploy.sh)
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'DockerBackend/**'
            frontend:
              - 'DockerFe/**'

  # ---------------------------------------------------------------------------
  # backend: build (and on main, push) the Spring Boot image
  # ---------------------------------------------------------------------------
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE_PREFIX,,}/backend" >> "$GITHUB_ENV"

      # Builds DockerBackend/Dockerfile. "cache-from/to: gha" keeps Docker's layer
      # cache between runs, so the dependency-download layer is reused.
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./DockerBackend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ---------------------------------------------------------------------------
  # frontend: lint, then build (and on main, push) the Next.js image
  # ---------------------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DockerFe/package-lock.json

      - name: Lint
        working-directory: DockerFe
        run: |
          npm ci
          npm run lint

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE_PREFIX,,}/frontend" >> "$GITHUB_ENV"

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./DockerFe
          build-args: |
            BACKEND_URL=http://backend:8080
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # deploy: SSH into your server, pull the new images, restart only those services
  #
  # Skipped until you set these in GitHub → Settings → Secrets and variables → Actions:
  #   Variables: DEPLOY_HOST (server IP/domain), DEPLOY_USER (ssh user),
  #              DEPLOY_PATH (folder on the server, e.g. /opt/noob-dev)
  #   Secrets:   DEPLOY_SSH_KEY (private key), GHCR_TOKEN (PAT with read:packages)
  # ---------------------------------------------------------------------------
  deploy:
    needs: [changes, backend, frontend]
    # always() → run even though one of backend/frontend was skipped;
    # but never if one of them FAILED.
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      vars.DEPLOY_HOST != '' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Work out which services to restart
        id: svc
        run: |
          s=""
          [ "${{ needs.backend.result }}" = "success" ]  && s="$s backend"
          [ "${{ needs.frontend.result }}" = "success" ] && s="$s frontend"
          echo "list=$s" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${IMAGE_PREFIX,,}" >> "$GITHUB_OUTPUT"

      # Copy the compose files to the server (they may have changed too).
      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml,docker-compose.prod.yml,.env.example
          target: ${{ vars.DEPLOY_PATH }}

      - name: Pull and restart changed services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            [ -f .env ] || cp .env.example .env
            export IMAGE_PREFIX="${{ steps.svc.outputs.image_prefix }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $COMPOSE pull ${{ steps.svc.outputs.list }}
            $COMPOSE up -d --no-deps --wait ${{ steps.svc.outputs.list }}
            $COMPOSE up -d --wait          # start anything not running yet (first deploy)
            docker image prune -f          # remove old, now-unused image versions
